# ===================================
# A股自选股智能分析系统 - Docker Compose
# ===================================
# 
# 使用方式:
#   定时模式: docker-compose -f ./docker/docker-compose.yml up -d
#   FastAPI模式: docker-compose -f ./docker/docker-compose.yml up -d server
#   同时启动: docker-compose -f ./docker/docker-compose.yml up -d analyzer server

name: daily-stock-analysis
version: '3.8'

x-common: &common
  build:
    context: ..
    dockerfile: docker/Dockerfile
  restart: unless-stopped

  # 环境变量（从 .env 文件加载）。不要将 ../.env 作为单文件 volume 挂载到 /app/.env，
  # 否则 Docker mount point 会阻止配置保存时的 os.replace 原子更新。
  env_file:
    - ../.env

  volumes:
    - ../data:/app/data
    - ../logs:/app/logs
    - ../reports:/app/reports
    - ../strategies:/app/strategies:ro
    # Longbridge OAuth token cache persistence; entrypoint repairs container-side ownership for dsa user.
    # Create ../longbridge_tokens on the host before copying an authorized token cache into it.
    - ../longbridge_tokens:/home/dsa/.longbridge
    # 如需覆盖前端静态资源，可挂载本地 static 目录
    # - ../static:/app/static:ro

  environment:
    - TZ=${TZ:-Asia/Seoul}

    # Web/API service bind address (must be 0.0.0.0 inside container)
    - WEBUI_HOST=0.0.0.0
    # The app listens on 8000 inside the container (--port 8000 fixed).
    # WEBUI_DOCKER_PORT controls the host-side published port (default 8001); WEBUI_PORT is for local dev only.

    # 代理设置（如果需要）
    # - http_proxy=http://host.docker.internal:10809
    # - https_proxy=http://host.docker.internal:10809
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  # 资源限制：完整分析建议 1G+；512M 仅适合轻量 Web/API、单股、低并发场景，
  # 且建议设置 MAX_WORKERS=1 并避免同时启动 analyzer 和 server。
  deploy:
    resources:
      limits:
        memory: 1G
      reservations:
        memory: 512M

services:
  # 定时任务模式
  analyzer:
    <<: *common
    container_name: stock-analyzer
    # 供下方 autoheal 识别；未启用 autoheal 时该标签无任何作用。
    labels:
      autoheal: "true"

  # FastAPI 模式
  server:
    <<: *common
    container_name: stock-server
    command: ["python", "main.py", "--serve-only", "--host", "0.0.0.0", "--port", "8000"]
    # 若使用 network_mode: host，则以下 ports 映射无效，端口由 command 中的 --port 指定
    ports:
      - "${WEBUI_DOCKER_PORT:-8001}:8000"

  # 自动恢复（可选，opt-in）
  #
  # Docker 只会把健康检查失败的容器标记为 unhealthy，并不会据此重启它
  # （restart 策略只响应进程退出）。analyzer 的调度线程一旦卡死，进程仍然活着，
  # 所以没有外部看护就只能靠人工发现——2026-07-24 就这样静默了 14.5 小时。
  # 本服务监听带 autoheal 标签的容器，持续 unhealthy 时将其重启。
  #
  # 默认不启动（profiles）：它需要挂载 docker.sock，等同于宿主机 root 权限，
  # 不应强加给所有部署。启用方式（显式点名该服务即可）：
  #   docker-compose -f ./docker/docker-compose.yml up -d analyzer autoheal
  #
  # 注意：启用后 SCHEDULER_HEARTBEAT_MAX_AGE_SECONDS 就从「告警阈值」变成了
  # 「硬性重启期限」。该阈值按分析进度刷新（不是按整轮耗时），所以正常长跑不会被误杀；
  # 但若某轮分析真的长时间没有任何进展，容器会被重启并丢失该轮结果。
  autoheal:
    image: willfarrell/autoheal:1.2.0
    container_name: stock-autoheal
    restart: unless-stopped
    profiles: ["autoheal"]
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      # 每 10s 巡检一次；容器启动后 300s 内不介入，避免冷启动期误重启。
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=300
      - DOCKER_SOCK=/var/run/docker.sock
      - TZ=${TZ:-Asia/Seoul}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
